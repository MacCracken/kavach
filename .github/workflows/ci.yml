name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # `cyrius deps` populates ./lib/ from the version-pinned snapshot,
  # which then shadows the global ~/.cyrius/versions/<V>/lib snapshot
  # on every subsequent `cyrius build` invocation. That's intentional
  # (the cwd lib IS the version-pinned content cyrius deps just
  # copied); silence the informational note across all CI steps.
  CYRIUS_NO_WARN_SHADOW_LIB: "1"

  # Whole-program dead-code elimination — smaller binaries, faster
  # link, matches the agnosys/agnostik/majra CI pattern.
  CYRIUS_DCE: "1"

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Cyrius toolchain
        # The cyrius.cyml `[package].cyrius` pin is the single source of
        # truth — no version hardcoded in YAML. Hand the pin to the
        # canonical upstream installer, which lays out the version-aware
        # ~/.cyrius tree (versions/<pin>/{bin,lib} + bin/lib symlinks +
        # a `current` file) that the 6.0.x toolchain resolves the pin
        # against. The old manual tarball-fetch + flat `cp` into
        # ~/.cyrius/{bin,lib} predated that layout — and hardcoded a
        # `bin/cc5` check, but 6.0.x renamed the compiler binary to
        # `cycc`, so that check broke on the 6.0 line. The installer
        # ships whatever the binary is named. Same step as patra /
        # samvada.
        run: |
          set -e
          CYRIUS_VERSION="${CYRIUS_VERSION:-$(grep -E '^cyrius[[:space:]]*=' cyrius.cyml | sed -E 's/^cyrius[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/')}"
          echo "Installing Cyrius $CYRIUS_VERSION"
          curl -sSf https://raw.githubusercontent.com/MacCracken/cyrius/main/scripts/install.sh | \
            CYRIUS_VERSION="$CYRIUS_VERSION" sh
          echo "$HOME/.cyrius/bin" >> "$GITHUB_PATH"

      - name: Resolve dependencies
        # Populates ./lib/ from cyrius.cyml [deps] stdlib + [deps.sigil]
        # at the pinned tag. ./lib/ is gitignored (see .gitignore).
        run: cyrius deps

      - name: Verify dep hashes
        # Skip if cyrius.lock isn't in the tree yet — first push that
        # introduces deps under the new manifest has to land the
        # lockfile before this gate can enforce.
        run: |
          if [ -f cyrius.lock ]; then
            cyrius deps --verify
          else
            echo "::warning::cyrius.lock not committed — skipping hash verification"
          fi

      - name: Symbol collisions
        # 3.12.9. cyrius resolves a name defined twice by source order and only
        # warns when it is a `fn`; a shared `var` or enum member is silent. So
        # `InjectionMethod.STDIN` (2) became the stdlib's `var STDIN = 0` in a
        # consumer, and a stdin secret was routed as an env var. This fails on a
        # kavach name defined twice, a `fn` shared with lib/, or a constant shared
        # with lib/ at a different value. See the script's header.
        run: python3 scripts/check-symbols.py

      - name: Format check
        # ⚠ The premise this step was built on is false, and it inverted the
        # outcome. `cyrius fmt <file>` does NOT write to stdout — it rewrites
        # the file IN PLACE and prints nothing (`cyrius fmt` usage: "(no flag)
        # rewrite the file in place"). Diffing its empty stdout against the
        # file reported drift for EVERY file, including ones `cyrfmt --check`
        # calls correctly formatted, so the output was pure noise and the
        # v3.2 "flip to exit 1" item could never be judged done.
        #
        # `--check` is the purpose-built flag: exit 1 if not canonically
        # formatted, and say where. It emits no stdout by design — that was
        # the property the old comment mistook for a defect.
        #
        # Now blocking, and the drift it was tracking is cleared (3.11.15).
        run: |
          drift=0
          for f in src/*.cyr tests/*.cyr tests/*.tcyr tests/*.bcyr tests/*.fcyr; do
            [ -f "$f" ] || continue
            if ! cyrius fmt "$f" --check > /dev/null 2>&1; then
              echo "needs fmt: $f"
              drift=1
            fi
          done
          if [ $drift -ne 0 ]; then
            echo "::error::fmt drift — run 'cyrius fmt <file>' on the files above"
            exit 1
          fi

      - name: Lint
        # `cyrius lint` exits with the warning count, so the `$(...)`
        # capture would trip `set -eo pipefail` on the first file with
        # any warnings — explicit `|| true` keeps the loop alive long
        # enough to print the full picture before failing.
        #
        # Cleared in v3.1.1: the long-line warnings inherited from the
        # v3.0 cut (37 across scanning_code / scanning_data / backend_sgx
        # / oci_spec / scanning_runtime) were rewrapped without any
        # semantic change. Hard-fail gate restored.
        run: |
          total=0
          for f in src/*.cyr; do
            [ -f "$f" ] || continue
            out=$(cyrius lint "$f" 2>&1 || true)
            echo "$out"
            n=$(echo "$out" | grep -cE '^\s*warn ' || true)
            total=$((total + n))
          done
          if [ "$total" -gt 0 ]; then
            echo "lint: $total warning(s) across src/"
            exit 1
          fi

      - name: Vet (include-graph audit)
        run: cyrius vet src/main.cyr

      - name: Build (x86_64, DCE)
        run: |
          mkdir -p build
          cyrius build src/main.cyr build/kavach
          echo "kavach (x86_64): $(wc -c < build/kavach) bytes"

      - name: Verify ELF
        run: xxd -l 4 build/kavach | grep -q "7f45 4c46"

      - name: Verify dist bundles fresh
        # kavach is consumable as a source-level library: the committed
        # bundles + their `.deps` stdlib sidecars are what downstream imports —
        # `dist/kavach.cyr` from `[lib]` (mehman's M1 host, …) and
        # `dist/kavach-confine.cyr` from `[lib.confine]` (thoth). `--all` folds
        # the base AND every profile; plain `cyrius distlib` folds only `[lib]`,
        # which is how the confine bundle shipped 3.12.3 content through 3.12.5
        # without this gate noticing. `git status` (not `git diff`) so a new
        # profile's never-committed bundle fails too. Same pattern as sigil /
        # bhumi CI.
        run: |
          cyrius distlib --all
          if [ -n "$(git status --porcelain dist/)" ]; then
            echo "dist/ is stale — run \`cyrius distlib --all\` and commit"
            git status --porcelain dist/
            git --no-pager diff --stat dist/
            exit 1
          fi
          echo "dist bundles are fresh"

      - name: Dist bundles compile for a consumer
        # 3.13.0. Fresh is not the same as compiling: a consumer vendors only
        # the stdlib leaves a bundle's `.deps` sidecar lists, and a module can
        # call a function that lives outside its profile. The confine bundle
        # shipped 3.12.4 and 3.12.5 unable to compile, and a 3.13.0 draft called
        # `is_digit_c`, which `[lib.confine]` does not carry. See the script.
        run: python3 scripts/check-bundles.py

      - name: Smoke test
        run: |
          ./build/kavach > /tmp/kavach_out 2>&1 || true
          grep -q "kavach v" /tmp/kavach_out || { echo "FAIL: banner missing"; cat /tmp/kavach_out; exit 1; }

      - name: Tests
        # 3.12.9: the summary also goes out as a notice, which the checks API
        # serves without authentication. Job logs need admin rights, so this is
        # how a run's count, and whether seccomp actually loaded, can be read.
        run: |
          rc=0
          cyrius test tests/kavach.tcyr > /tmp/kavach_tests.txt 2>&1 || rc=$?
          cat /tmp/kavach_tests.txt
          sum=$(grep -E '^[0-9]+ passed' /tmp/kavach_tests.txt | tail -1)
          sec="seccomp loaded"
          grep -q "host refuses seccomp" /tmp/kavach_tests.txt && sec="seccomp refused by host"
          echo "::notice title=tests (x86_64)::${sum:-no summary line} — ${sec}"
          exit $rc

      - name: Benchmarks
        run: cyrius bench tests/kavach.bcyr

      - name: Fuzz
        # Single-harness fuzz target; bounded run length keeps CI time
        # in check while still exercising the scanner / gate paths.
        run: |
          cyrius build tests/kavach.fcyr build/kavach_fuzz
          timeout 10 build/kavach_fuzz 500 || { echo "FUZZ CRASH"; exit 1; }

  aarch64:
    # 3.12.8. Until this job existed nothing built or ran kavach for aarch64,
    # and x86-64 values sat in the tree for releases: raw syscall numbers the
    # aarch64 backend ran as other calls, `struct stat` read at x86-64
    # offsets, and a seccomp filter of x86-64 numbers. Under qemu-user the
    # 3.12.7 suite failed 19 assertions and then segfaulted; this job fails
    # the build on any of that instead. The agnos build rides along because
    # agnos compiles a different arm of every `#ifdef CYRIUS_TARGET_AGNOS`.
    name: aarch64 (cross-build + qemu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Cyrius toolchain
        # Same step as build-and-test: the cyrius.cyml pin, via the upstream
        # installer, which also ships cycc_aarch64.
        run: |
          set -e
          CYRIUS_VERSION="${CYRIUS_VERSION:-$(grep -E '^cyrius[[:space:]]*=' cyrius.cyml | sed -E 's/^cyrius[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/')}"
          echo "Installing Cyrius $CYRIUS_VERSION"
          curl -sSf https://raw.githubusercontent.com/MacCracken/cyrius/main/scripts/install.sh | \
            CYRIUS_VERSION="$CYRIUS_VERSION" sh
          echo "$HOME/.cyrius/bin" >> "$GITHUB_PATH"

      - name: Install qemu-user
        # Verified locally against Ubuntu 24.04's qemu-aarch64 8.2.2 and 11.1.1.
        # qemu-user answers PR_SET_SECCOMP with EINVAL, so the seccomp tests
        # take their fail-closed arm here; the native job below loads filters.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user
          qemu-aarch64 --version | head -1

      - name: Resolve dependencies
        run: cyrius deps

      - name: Cross-build (aarch64, agnos)
        # kavach's own x86-64-only syscall numbers are declared under
        # `#ifdef CYRIUS_ARCH_X86`, so an aarch64 use of one fails right here.
        run: |
          mkdir -p build
          cyrius build --aarch64 src/main.cyr build/kavach-aarch64
          file build/kavach-aarch64 | grep -q "ARM aarch64" || { echo "not an aarch64 ELF"; exit 1; }
          cyrius build --agnos src/main.cyr build/kavach-agnos
          cyrius build --aarch64 tests/kavach.tcyr build/kavach-test-aarch64

      - name: Smoke test (aarch64, qemu)
        run: |
          qemu-aarch64 build/kavach-aarch64 > /tmp/kavach_a64_out 2>&1 || true
          grep -q "kavach v" /tmp/kavach_a64_out || { echo "FAIL: banner missing"; cat /tmp/kavach_a64_out; exit 1; }

      - name: Tests (aarch64, qemu)
        run: |
          rc=0
          qemu-aarch64 build/kavach-test-aarch64 > /tmp/kavach_tests.txt 2>&1 || rc=$?
          cat /tmp/kavach_tests.txt
          sum=$(grep -E '^[0-9]+ passed' /tmp/kavach_tests.txt | tail -1)
          echo "::notice title=tests (aarch64 / qemu)::${sum:-no summary line}"
          exit $rc

      - name: Upload the aarch64 test binary
        uses: actions/upload-artifact@v7
        with:
          name: kavach-test-aarch64
          path: build/kavach-test-aarch64
          retention-days: 7

  aarch64-native:
    # The same test binary on aarch64 hardware, where seccomp filters load and
    # the per-arch tables meet a real kernel. Added at 3.12.8 as informational;
    # blocking since 3.12.9, after it ran green on both 3.12.8 runs (CI and the
    # release gate).
    name: aarch64 (native)
    needs: aarch64
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: kavach-test-aarch64
          path: build

      - name: Tests (aarch64, native)
        run: |
          chmod +x build/kavach-test-aarch64
          rc=0
          build/kavach-test-aarch64 > /tmp/kavach_tests.txt 2>&1 || rc=$?
          cat /tmp/kavach_tests.txt
          sum=$(grep -E '^[0-9]+ passed' /tmp/kavach_tests.txt | tail -1)
          sec="seccomp loaded"
          grep -q "host refuses seccomp" /tmp/kavach_tests.txt && sec="seccomp refused by host"
          echo "::notice title=tests (aarch64 / native $(uname -m))::${sum:-no summary line} — ${sec}"
          exit $rc

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Scan for dangerous patterns
        # Code-only matches (the awk filter drops `#` comment lines).
        # kavach's `backend_process.cyr` execve is the whole point —
        # allowlisted. The scanner modules (`scanning_code.cyr`,
        # `scanning_runtime.cyr`) carry literal `/etc/shadow`,
        # `/etc/passwd`, `/etc/sudoers`, `/etc/gshadow` string
        # constants because their job is to DETECT sandboxed code
        # touching those paths — pattern data, not access. Anywhere
        # else under src/ that hardcodes `/etc/` is a regression.
        #
        # ⚠ Patterns are EXTENDED regexes (`grep -E`). Until 3.12.8 the scan ran
        # plain `grep`, where `\(` opens a group: the syscall-59 pattern did not
        # compile (GNU grep: "Unmatched ( or \("), the stderr below swallowed the
        # error, and the gate passed on every tree — a planted `syscall(59, …)`
        # went through. A pattern that does not compile now fails the job.
        run: |
          FAIL=0
          scan() {
            local label="$1"; shift
            local pat="$1"; shift
            local hits
            # grep exits 1 on a valid pattern (no match in /dev/null) and 2 on
            # one that does not compile; `||` keeps `bash -e` from stopping on the 1.
            local rc=0
            grep -E -e "$pat" /dev/null > /dev/null 2>&1 || rc=$?
            if [ "$rc" -eq 2 ]; then
              echo "FAIL: $label — pattern does not compile: $pat"
              FAIL=1
              return
            fi
            hits=$(grep -rnE -e "$pat" src/ 2>/dev/null | awk -F: '
              { line=$3; for(i=4;i<=NF;i++) line=line":"$i;
                sub(/^[[:space:]]+/,"",line);
                if (substr(line,1,1) != "#") print $1":"$2":"line }')
            # Remaining args are allowlisted files (paths under src/).
            for allow in "$@"; do
              hits=$(echo "$hits" | grep -v "^$allow:" || true)
            done
            if [ -n "$hits" ]; then
              echo "FAIL: $label"
              echo "$hits"
              FAIL=1
            fi
          }
          # Raw execve outside the documented backend entry points.
          scan "raw execve (syscall 59)" '\bsyscall\(\s*59\b' src/backend_process.cyr
          # Any raw syscall number (3.12.8). Spell the stdlib's SYS_* / sys_*:
          # each Linux peer carries its own number, and aarch64 runs an
          # untranslated x86 number as a different call, silently.
          scan "raw syscall number (use the stdlib's SYS_* / sys_*)" '\bsyscall\(\s*[0-9]'
          # A syscall number kavach declares itself. Only the two files that
          # document why may: sys_security_syscalls.cyr (x86-64 unshare and
          # chroot, which the stdlib does not name yet) and kernel_audit.cyr
          # (the agnos audit call).
          scan "SYS_* number declared in src/" '\bSYS_[A-Z0-9_]+\s*=\s*[0-9]' \
            src/sys_security_syscalls.cyr src/kernel_audit.cyr
          # Hardcoded /etc paths — kavach has no business writing to
          # system config; injection / mount escape territory.
          # Scanner modules carry pattern strings, not access calls.
          scan "writes to /etc" '"/etc/' src/scanning_code.cyr src/scanning_runtime.cyr
          echo "security scan complete (fail: $FAIL)"
          exit $FAIL

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check required docs
        run: |
          MISSING=0
          for doc in README.md CHANGELOG.md CLAUDE.md CONTRIBUTING.md SECURITY.md CODE_OF_CONDUCT.md LICENSE VERSION cyrius.cyml docs/doc-health.md docs/development/roadmap.md docs/architecture/overview.md; do
            if [ -f "$doc" ]; then echo "  OK: $doc"; else echo "  MISSING: $doc"; MISSING=1; fi
          done
          exit $MISSING

      - name: Verify version consistency
        run: |
          FILE_VERSION=$(tr -d '[:space:]' < VERSION)
          CYML_VERSION=$(grep '^version = ' cyrius.cyml | head -1 | sed -E 's/version = "([^"]+)".*/\1/')
          # cyrius.cyml uses ${file:VERSION} — treat the literal as "match"
          if [ "$CYML_VERSION" != '${file:VERSION}' ] && [ "$CYML_VERSION" != "$FILE_VERSION" ]; then
            echo "FAIL: VERSION ($FILE_VERSION) != cyrius.cyml ($CYML_VERSION)"
            exit 1
          fi
          grep -q "\[$FILE_VERSION\]" CHANGELOG.md || { echo "FAIL: version $FILE_VERSION not in CHANGELOG.md"; exit 1; }
          echo "Version consistent: $FILE_VERSION"

      - name: Currency check (CHANGELOG dated entry)
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          TODAY=$(date -u +%Y-%m-%d)
          CL_LINE=$(grep -E "^## \[$VERSION\] — [0-9]{4}-[0-9]{2}-[0-9]{2}" CHANGELOG.md || true)
          if [ -z "$CL_LINE" ]; then
            echo "FAIL: CHANGELOG.md has no dated entry for $VERSION"
            echo "Expected: '## [$VERSION] — YYYY-MM-DD'"
            exit 1
          fi
          CL_DATE=$(echo "$CL_LINE" | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}')
          if [[ "$CL_DATE" > "$TODAY" ]]; then
            echo "FAIL: CHANGELOG entry for $VERSION dated $CL_DATE (future)"
            exit 1
          fi
          echo "  CHANGELOG: $VERSION dated $CL_DATE"
